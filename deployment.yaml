apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs454-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cs454-service
  template:
    metadata:
      labels:
        app: cs454-service
    spec:
      containers:
        - name: api
          image: cs454-midterm:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: SERVICE_NAMEs
              value: kubernetes
            - name: MESSAGE
              value: Hello from kubernetes
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  selector:
    app: cs454-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP