services:
  web:
    image: nginx:alpine
    container_name: web_service
    ports:
      - "8080:80"
    environment:
      - APP_ENV=production
      - VERSION=1.0.0
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always
